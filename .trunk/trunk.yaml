version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
    - rust@1.92.0

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available

lint:
  enabled:
    - pinact@4.1.1
    - actionlint@1.7.12
    - buildifier@8.5.1
    - checkov@3.3.9
    - git-diff-check
    - markdownlint@0.49.1
    - osv-scanner@2.4.0
    - prettier@3.9.6
    - rustfmt@1.92.0
    - taplo@0.10.0
    - trufflehog@3.96.0
    - yamllint@1.38.0
    - clippy@1.92.0

tools:
  runtimes:
    - rust
  enabled:
    - gh@2.81.0
    - jq@jq-1.7.1
