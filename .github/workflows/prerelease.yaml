name: prelease tool
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: Tag to create
concurrency: ${{ github.workflow }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            os: linux
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            os: linux
          - target: aarch64-apple-darwin
            runs-on: macos-14
            os: macos
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up toolchains
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt update;
            sudo apt install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu;
          fi

      - name: update version
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            sed -i '' "s/version = \"0.0.0\"/version = \"${{ github.event.inputs.release_tag }}\"/" Cargo.toml
          else
            sed -i "s/version = \"0.0.0\"/version = \"${{ github.event.inputs.release_tag }}\"/" Cargo.toml
          fi

      - name: Build --release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          HORTON_RELEASE: ${{ github.event.inputs.release_tag }}
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary
        run: |
          # Make the binary executable so it is ready to run straight out of the
          # archive (tar preserves the mode, so no chmod is needed downstream).
          chmod 0755 target/${{ matrix.target }}/release/mq
          tar czvf \
            mq-${{ github.event.inputs.release_tag }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release mq

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: mq-${{ github.event.inputs.release_tag }}-${{ matrix.target }}.tar.gz

  tag_and_release:
    name: Tag and Release [ ${{ github.event.inputs.release_tag }} ]
    runs-on: [ubuntu-latest]
    needs: [build]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: trunk install
        uses: trunk-io/trunk-action/install@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          tools: gh

      - id: download
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum mq-*.tar.gz > SHA256SUMS.txt

      - name: Create GH release and upload binaries
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --target ${{ github.ref }}  \
            ${{ github.event.inputs.release_tag }} \
            mq-*.tar.gz SHA256SUMS.txt --generate-notes --prerelease
